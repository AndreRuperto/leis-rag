services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: leis
      POSTGRES_USER: leis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leis_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leis -d leis"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: ${INSTALL_EMBEDDINGS:-0}
    environment:
      DATABASE_URL: postgresql://leis:${POSTGRES_PASSWORD:-leis_local}@db:5432/leis
      DATA_DIR: /srv/dados
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - ./dados:/srv/dados:ro
      - model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model_cache:
