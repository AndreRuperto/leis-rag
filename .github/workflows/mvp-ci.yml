name: MVP · Testes
on:
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/mvp-ci.yml"
  push:
    branches:
      - "feat/**"
    paths:
      - "app/**"
      - ".github/workflows/mvp-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest -q app/tests
