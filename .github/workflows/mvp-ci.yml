name: MVP · Testes
on:
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".github/workflows/mvp-ci.yml"
  push:
    branches:
      - "feat/**"
    paths:
      - "app/**"
      - ".github/workflows/mvp-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: leis_test
          POSTGRES_USER: leis
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leis -d leis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://leis:ci_only_password@localhost:5432/leis_test
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt pytest httpx
      - run: python -m compileall -q app
      - run: python -m pytest -q app/tests
